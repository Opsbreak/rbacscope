# CI namespace: a GitLab runner (Kubernetes executor) that creates build
# pods, sharing the namespace with a "deployer" service account that the CD
# pipeline uses and that was bound to cluster-admin "temporarily".
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-runner
  namespace: ci
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: ci
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-runner
  namespace: ci
rules:
- apiGroups: [""]
  resources: ["pods", "secrets", "configmaps"]
  verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
- apiGroups: [""]
  resources: ["pods/exec", "pods/attach"]
  verbs: ["create", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-runner
  namespace: ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-runner
subjects:
- kind: ServiceAccount
  name: gitlab-runner
  namespace: ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ci-deployer-cluster-admin
  annotations:
    note: "temporary - remove after migration"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: deployer
  namespace: ci
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-runner
  namespace: ci
spec:
  template:
    spec:
      serviceAccountName: gitlab-runner
      containers:
      - name: runner
        image: gitlab/gitlab-runner:v17.4.0
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-deploy
  namespace: ci
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: deployer
          automountServiceAccountToken: true
          restartPolicy: Never
          containers:
          - name: deploy
            image: example.org/deploy-tool:1.8
